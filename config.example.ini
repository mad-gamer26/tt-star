[star]
hosts =
    ws://localhost:7774
request_timeout = 60

[bot]
command_prefix = !
default_voice =
voice_preview_text = Hello there, my name is {voice}.
max_voice_results = 20
temp_dir =

[teamtalk]
reconnect_seconds = 5
license_name =
license_key =

[web]
# The management page. No password: keep it on 127.0.0.1 behind a proxy
# that admits only trusted addresses (see README).
enabled = no
host = 127.0.0.1
port = 8776

[server:example]
enabled = yes
host = teamtalk.example.com
tcp_port = 10333
udp_port = 10333
encrypted = yes
nickname = STAR Bot
username = bot-account
password = replace-me
channel = /
channel_password =
